<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XBOOK — إنشاء حساب</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body class="authPage"><main class="authLayout"><section class="authVisual registerVisual"><a class="brand" href="/"><span class="brandMark">X</span><span><b>XBOOK</b><small>BOOKS ARE YOUR MISSION</small></span></a><div><span class="classified">NEW STUDENT // XBOOK</span><h1>أنشئ ملفك<br><em>الدراسي.</em></h1><p>بياناتك تساعدنا على تجهيز الطلب وتوصيله للعنوان الصحيح.</p></div></section><section class="authPanel"><div class="authCard registerCard"><span class="eyebrow">CREATE PROFILE</span><h2>إنشاء حساب</h2><p class="muted">املأ بياناتك الأساسية مرة واحدة.</p><form id="registerForm" class="accountForm"><div class="formGrid"><label>الاسم<input name="name" required autocomplete="given-name"></label><label>اسم العائلة<input name="family_name" required autocomplete="family-name"></label><label>رقم الهاتف<input name="phone" required autocomplete="tel" placeholder="01xxxxxxxxx"></label><label>رقم هاتف بديل<input name="alternate_phone" autocomplete="tel" placeholder="اختياري"></label><label>المحافظة<select name="governorate" required><option value="">اختر المحافظة</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>الغربية</option><option>الدقهلية</option><option>الشرقية</option><option>البحيرة</option><option>القليوبية</option><option>المنوفية</option><option>كفر الشيخ</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><opti
